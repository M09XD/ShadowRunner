spring.application.name=shadow-runner
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# MAJOR FIX #24: Configure connection pool to prevent exhaustion
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Database Configuration - MINOR FIX #25: Use environment variables for credentials
spring.datasource.url=jdbc:postgresql://localhost:54969/ShadowRunner
spring.datasource.username=${DB_USERNAME:SRpostgres}
spring.datasource.password=${DB_PASSWORD:SRpostgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# WebSocket Configuration
spring.websocket.enabled=true

# JWT Configuration - CRITICAL FIX #1: Add JWT secret and expiration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.shadowrunner=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# Application Properties
app.pokemon-api-base-url=https://pokeapi.co/api/v2
app.pokemon-api-timeout=10000

# Open-in-view warning fix
spring.jpa.open-in-view=false
